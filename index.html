<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الحضور والانصراف والتقرير</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1, h2 { color: #1F4E78; text-align: center; }
        .form-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; background: #eef4f8; padding: 20px; border-radius: 8px; }
        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #1F4E78; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { background-color: #1F4E78; color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:hover { background-color: #153450; }
        .btn-export { background-color: #27ae60; margin-top: 10px; }
        .btn-export:hover { background-color: #1e8449; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #1F4E78; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>[hidden]{display:none!important} #status{white-space:pre-wrap;color:#1F4E78;margin:12px 0} button:disabled{opacity:.5;cursor:wait}</style>
</head>
<body>
    <div class="container">
        <div id="loginPanel">
          <h2>تسجيل الدخول</h2>
          <form id="loginForm" class="form-group">
            <div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div>
            <div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div>
            <button id="loginButton" type="submit">دخول</button>
          </form>
        </div>
        <div id="sessionPanel" hidden><span id="accountEmail"></span> <button id="logoutButton">تسجيل الخروج</button> <button id="reloadButton">تحديث السجلات</button></div>
        <p id="status" role="status" aria-live="polite"></p>
        <div id="appPanel" hidden>
        <h1>نظام تسجيل الحضور والانصراف والإنتاجية</h1>
        
        <div class="form-group">
            <div class="field">
                <label>اسم الموظف:</label>
                <select id="empSelect"></select>
            </div>
            <div class="field">
                <label>التاريخ:</label>
                <input type="date" id="attDate">
            </div>
            <div class="field">
                <label>وقت الحضور:</label>
                <input type="time" id="checkIn" value="09:00">
            </div>
            <div class="field">
                <label>وقت الانصراف:</label>
                <input type="time" id="checkOut" value="17:00">
            </div>
            <div class="field">
                <label>ملاحظات / نوع الإجازة:</label>
                <select id="comments">
                    <option value="">حضور طبيعي</option>
                    <option value="Annual Leave">Annual Leave (إجازة سنوية)</option>
                    <option value="Casual Leave">Casual Leave (إجازة عارضة)</option>
                    <option value="Sick Leave">Sick Leave (إجازة مرضية)</option>
                    <option value="Attende at Another Project">Attende at Another Project</option>
                    <option value="Working Days in Weekends (Remotely)">عمل في العطلات (عن بُعد)</option>
                    <option value="Working Days in Weekends (On Site)">عمل في العطلات (في الموقع)</option>
                </select>
            </div>
        </div>
        <button id="addButton" onclick="addRecord()">إضافة تسجيل</button>
        <button class="btn-export" onclick="exportToExcel()">تصدير ملف Excel بنفس التنسيق</button>

        <h2>سجلات الحضور اليومية</h2>
        <table id="recordsTable">
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>اليوم</th>
                    <th>اسم الموظف</th>
                    <th>الحضور</th>
                    <th>الانصراف</th>
                    <th>ساعات العمل</th>
                    <th>الملاحظات</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    </div>

    <script>
        document.getElementById('attDate').valueAsDate = new Date();
        let records = [];
        let employees = [];
        let currentUser = null;
        let accessVersion = 0;
        let busy = false;
        let pendingRecord = null;
        const db = window.supabase.createClient('https://tsevfdrzoocllaojvgmr.supabase.co', 'sb_publishable_uR0JQkg8skRiUk95xQRpDA_s8gepEG5');
        const el = id => document.getElementById(id);
        function status(message) { el('status').textContent = message; }
        function renderRecords() {
          const body = document.querySelector('#recordsTable tbody');
          body.replaceChildren();
          records.forEach(r => {
            const row = body.insertRow();
            [r.Date,r.Day,r.Name,r.CheckIn,r.CheckOut,r.Hours,r.Comments].forEach(v => { row.insertCell().textContent = v ?? ''; });
          });
        }
        function mapRecord(r) {
          const employee = employees.find(e => e.id === r.employee_id);
          return {Id:r.id, EmployeeId:r.employee_id, Date:r.attendance_date,
            Day:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(r.attendance_date+'T12:00:00').getDay()],
            Name:employee?.name ?? String(r.employee_id), CheckIn:r.check_in?.slice(0,5) ?? '', CheckOut:r.check_out?.slice(0,5) ?? '', Hours:r.hours, Comments:r.comments};
        }
        async function loadData(version) {
          const {data:people,error:peopleError} = await db.from('employees').select('id,name,lob,display_order').order('display_order');
          if(peopleError) throw peopleError;
          const rows=[];
          for(let start=0;;start+=1000) {
            const {data,error} = await db.from('attendance_records').select('*').order('created_at').order('id').range(start,start+999);
            if(error) throw error;
            rows.push(...data);
            if(data.length<1000) break;
          }
          if(version !== accessVersion) return;
          employees=people;
          const select=el('empSelect'); const previous=select.value; select.replaceChildren();
          employees.forEach(e=> { const option=document.createElement('option'); option.value=String(e.id); option.textContent=`${e.name} (${e.id})`; select.append(option); });
          if(employees.some(e=>String(e.id)===previous)) select.value=previous;
          records=rows.map(mapRecord); renderRecords();
        }
        async function showSession(session) {
          const version=++accessVersion;
          currentUser=session?.user ?? null;
          pendingRecord=null; records=[]; employees=[]; renderRecords();
          el('empSelect').replaceChildren(); el('appPanel').hidden=true;
          el('loginPanel').hidden=!!currentUser; el('sessionPanel').hidden=!currentUser;
          if(!currentUser) {status('سجّل الدخول لعرض سجلات الحضور.'); return;}
          el('accountEmail').textContent=currentUser.email;
          status('جارٍ تحميل البيانات...');
          try {
            const {data,error}=await db.from('app_users').select('user_id').eq('user_id',currentUser.id).maybeSingle();
            if(error) throw error;
            if(version !== accessVersion) return;
            if(!data) {status('هذا الحساب لم يتم تفعيل صلاحية الحضور له. تواصل مع مسؤول المشروع.'); return;}
            await loadData(version);
            if(version !== accessVersion) return;
            el('appPanel').hidden=false;
            status(`تم تحميل ${records.length} سجل حضور.`);
          } catch(error) {if(version===accessVersion) status('تعذر تحميل البيانات: '+error.message);}
        }
        el('loginForm').addEventListener('submit',async event=>{
          event.preventDefault(); el('loginButton').disabled=true; status('جارٍ تسجيل الدخول...');
          try {
            const {data,error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});
            if(error) throw error;
            el('password').value=''; await showSession(data.session);
          } catch(error) {status('تعذر تسجيل الدخول: '+error.message);}
          finally {el('loginButton').disabled=false;}
        });
        el('logoutButton').addEventListener('click',async()=>{
          const {error}=await db.auth.signOut({scope:'local'});
          if(error) {status('تعذر تسجيل الخروج: '+error.message); return;}
          await showSession(null);
        });
        el('reloadButton').addEventListener('click',async()=>{
          if(busy) return;
          const {data,error}=await db.auth.getSession();
          if(error) {status(error.message);return;}
          await showSession(data.session);
        });
        db.auth.onAuthStateChange((event,session)=>{
          if(event==='SIGNED_OUT') void showSession(null);
        });
        db.auth.getSession().then(({data,error})=>error?status(error.message):showSession(data.session));

        async function addRecord() {
            if(busy || !currentUser || el('appPanel').hidden) return;
            const employee = employees.find(e => String(e.id) === el('empSelect').value);
            if(!employee) {status('اختر الموظف أولاً.');return;}
            const empName = employee.name;
            const dateVal = document.getElementById('attDate').value;
            const inVal = document.getElementById('checkIn').value;
            const outVal = document.getElementById('checkOut').value;
            const commentVal = document.getElementById('comments').value;

            if(!dateVal) { alert('يرجى تحديد التاريخ'); return; }

            const d = new Date(dateVal);
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[d.getDay()];

            let hrs = "08:00";
            if(commentVal.includes('Leave')) {
                hrs = "00:00";
            } else if(inVal && outVal) {
                const t1 = new Date(`2000-01-01T${inVal}:00`);
                const t2 = new Date(`2000-01-01T${outVal}:00`);
                let diff = (t2 - t1) / (1000 * 60);
                if(diff < 0) diff += 24 * 60;
                const h = Math.floor(diff / 60);
                const m = diff % 60;
                hrs = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
            }

            const payload={employee_id:employee.id,attendance_date:dateVal,check_in:inVal||null,check_out:outVal||null,hours:hrs,comments:commentVal,created_by:currentUser.id};
            const signature=JSON.stringify(payload);
            if(!pendingRecord || pendingRecord.signature!==signature) pendingRecord={signature,id:crypto.randomUUID()};
            const id=pendingRecord.id;
            const version=accessVersion;
            busy=true; el('addButton').disabled=true;
            status('جارٍ حفظ التسجيل...');
            try {
              let {data,error}=await db.from('attendance_records').insert({id,...payload}).select().single();
              if(error?.code==='23505') {
                const retry=await db.from('attendance_records').select('*').eq('id',id).single();
                data=retry.data; error=retry.error;
              }
              if(error) throw error;
              if(version!==accessVersion) return;
              if(!records.some(r=>r.Id===data.id)) records.push(mapRecord(data));
              pendingRecord=null; renderRecords(); status('تم حفظ التسجيل في Supabase.');
            } catch(error) {if(version===accessVersion) status('تعذر تأكيد الحفظ. يمكنك إعادة المحاولة: '+error.message);}
            finally {busy=false;el('addButton').disabled=false;}

        }

        function exportToExcel() {
            if(records.length === 0) {
                alert('لا توجد سجلات لتصديرها! قم بإضافة بعض السجلات أولاً.');
                return;
            }

            const wb = XLSX.utils.book_new();

            // 1. Attendance Sheet
            const wsData = [["Date", "Day", "Name", "Check In", "Check Out", "Total Working Hours", "Comments"]];
            records.forEach(r => {
                wsData.push([r.Date, r.Day, r.Name, r.CheckIn, r.CheckOut, r.Hours, r.Comments]);
            });
            const ws1 = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws1, "Support Team Attendance");

            // 2. Summary Sheet
            const emps = employees;

            const summaryHeaders = [
                "ID", "Name", "LOB", "Month Days", "Signed In", 
                "Attende at Another Project", "Vacations \n(Annual/Causal)", 
                "Sick Leave", "Public Holidays", "Absence/ Not Signed In", 
                "Actual Working Hours", "Working Days in Weekends (Remotely)", 
                "Working Days in Weekends (On Site)", "Total Over Time "
            ];
            const summaryRows = [summaryHeaders];

            emps.forEach(e => {
                const empRecs = records.filter(r => r.EmployeeId === e.id);
                const signedIn = empRecs.filter(r => !r.Comments.includes('Leave')).length;
                const vac = empRecs.filter(r => r.Comments.includes('Annual') || r.Comments.includes('Casual')).length;
                const sick = empRecs.filter(r => r.Comments.includes('Sick')).length;

                summaryRows.push([
                    e.id, e.name, e.lob, 21, signedIn, null, vac > 0 ? vac : null, sick > 0 ? sick : null, null, null, "140:00", null, null, null
                ]);
            });

            const ws2 = XLSX.utils.aoa_to_sheet(summaryRows);
            XLSX.utils.book_append_sheet(wb, ws2, "Summary");

            XLSX.writeFile(wb, "Attendance_Report.xlsx");
        }
    </script>
</body>
</html>
