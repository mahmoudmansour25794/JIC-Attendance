<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الحضور والانصراف والتقرير</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1, h2 { color: #1F4E78; text-align: center; }
        .form-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; background: #eef4f8; padding: 20px; border-radius: 8px; }
        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #1F4E78; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { background-color: #1F4E78; color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:hover { background-color: #153450; }
        .btn-export { background-color: #27ae60; margin-top: 10px; }
        .btn-export:hover { background-color: #1e8449; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #1F4E78; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>[hidden]{display:none!important} #status{white-space:pre-wrap;color:#1F4E78;margin:12px 0} button:disabled{opacity:.5;cursor:wait}</style>
<style>
#datePages {display:flex; direction:ltr; align-items:center; justify-content:center; gap:12px; margin:14px 0}
#datePages button {background:#eef4f8; color:#1F4E78; border:1px solid #b7cddd; min-width:76px}
#displayedDate {direction:rtl; text-align:center; min-width:150px; font-weight:600}
#filterHint {color:#8a5200} #rangeSummary {font-weight:600} small {margin-top:6px; color:#666}
</style>
</head>
<body>
    <div class="container">
        <div id="loginPanel">
          <h2>تسجيل الدخول</h2>
          <form id="loginForm" class="form-group">
            <div class="field"><label for="username">اسم المستخدم</label><input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" dir="ltr" required></div>
            <div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div>
            <button id="loginButton" type="submit">دخول</button>
          </form>
        </div>
        <div id="sessionPanel" hidden><span id="accountUsername"></span> <button id="logoutButton">تسجيل الخروج</button> <button id="reloadButton">تحديث السجلات</button></div>
        <p id="status" role="status" aria-live="polite"></p>
        <div id="appPanel" hidden>
        <h1>نظام تسجيل الحضور والانصراف والإنتاجية</h1>
        
        <div class="form-group">
            <div class="field">
                <label>اسم الموظف:</label>
                <select id="empSelect"></select>
            </div>
            <div class="field">
                <label>التاريخ:</label>
                <input type="date" id="attDate">
            </div>
            <div class="field">
                <label>وقت الحضور:</label>
                <input type="time" id="checkIn" value="09:00">
            </div>
            <div class="field">
                <label>وقت الانصراف:</label>
                <input type="time" id="checkOut" value="17:00">
            </div>
            <div class="field">
                <label>ملاحظات / نوع الإجازة:</label>
                <select id="comments">
                    <option value="">حضور طبيعي</option>
                    <option value="Annual Leave">Annual Leave (إجازة سنوية)</option>
                    <option value="Casual Leave">Casual Leave (إجازة عارضة)</option>
                    <option value="Sick Leave">Sick Leave (إجازة مرضية)</option>
                    <option value="إذن ساعتين">إذن ساعتين</option>
                    <option value="Attende at Another Project">Attende at Another Project</option>
                    <option value="Working Days in Weekends (Remotely)">عمل في العطلات (عن بُعد)</option>
                    <option value="Working Days in Weekends (On Site)">عمل في العطلات (في الموقع)</option>
                </select>
            </div>
        </div>
        <p id="editNotice" role="status" hidden></p>
        <button id="cancelEditButton" onclick="cancelEdit()" hidden>إلغاء التعديل</button>
        <button id="addButton" onclick="addRecord()">إضافة تسجيل</button>
        <button id="exportButton" class="btn-export" onclick="exportToExcel()">تصدير ملف Excel بنفس التنسيق</button>

        <h2>سجلات الحضور اليومية</h2>
        <form id="filterForm" class="form-group">
          <div class="field"><label for="fromDate">من تاريخ (From date)</label><input type="date" id="fromDate" required></div>
          <div class="field"><label for="toDate">إلى تاريخ (To date)</label><input type="date" id="toDate"><small>لو تركته فارغًا، تُعرض السجلات حتى اليوم.</small></div>
          <button id="filterButton" type="submit">عرض الفترة</button>
          <button id="todayButton" type="button">اليوم</button>
        </form>
        <p id="rangeSummary" aria-live="polite"></p>
        <p id="filterHint" hidden>تم تغيير التواريخ. اضغط «عرض الفترة» لتحديث النتائج والتصدير.</p>
        <nav id="datePages" aria-label="التنقل بين أيام الحضور">
          <button id="previousDayButton" type="button" aria-label="اليوم السابق" disabled>← السابق</button>
          <span id="displayedDate" aria-live="polite"></span>
          <button id="nextDayButton" type="button" aria-label="اليوم التالي" disabled>التالي →</button>
        </nav>
        <p id="emptyRecords" hidden>لا توجد سجلات حضور في الفترة المختارة.</p>
        <div style="overflow-x:auto">
        <table id="recordsTable">
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>اليوم</th>
                    <th>اسم الموظف</th>
                    <th>الحضور</th>
                    <th>الانصراف</th>
                    <th>ساعات العمل</th>
                    <th>الملاحظات</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        </div>
    </div>
    </div>

    <script>
        // Calendar dates follow the team's timezone, including around UTC midnight.
        function todayDate(now = new Date()) {
          const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Africa/Cairo', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(now);
          const part = type => parts.find(p=>p.type===type).value;
          return `${part('year')}-${part('month')}-${part('day')}`;
        }
        document.getElementById('attDate').value = todayDate();
        document.getElementById('fromDate').value = todayDate();
        document.getElementById('toDate').value = todayDate();
        let activeRange = {from:todayDate(), to:todayDate()};
        let selectedDay = todayDate();
        let browseMode = 'home';
        let previousDay = null;
        let nextDay = null;
        let rangeLoaded = false;
        let records = [];
        let employees = [];
        let currentUser = null;
        let accessVersion = 0;
        let busy = false;
        let pendingRecord = null;
        let editingId = null;
        let originalForm = null;
        const SUPABASE_URL = 'https://tsevfdrzoocllaojvgmr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_uR0JQkg8skRiUk95xQRpDA_s8gepEG5';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const el = id => document.getElementById(id);
        function status(message) { el('status').textContent = message; }
        function sortedRecords() {
          return records.slice().sort((a,b)=>a.Date.localeCompare(b.Date) || (a.CreatedAt||'').localeCompare(b.CreatedAt||'') || a.Id.localeCompare(b.Id));
        }
        function filterDirty() {
          return el('fromDate').value !== activeRange.from || (el('toDate').value || todayDate()) !== activeRange.to;
        }
        function updateFilterHint() {
          el('filterHint').hidden=!filterDirty();
          el('exportButton').disabled=busy || !rangeLoaded || filterDirty();
          el('previousDayButton').disabled=busy || !rangeLoaded || filterDirty() || !previousDay;
          el('nextDayButton').disabled=busy || !rangeLoaded || filterDirty() || !nextDay;
        }
        function datesInRange() { return [...new Set(records.map(r=>r.Date))].sort(); }
        function renderDatePages() {
          if(browseMode==='range') {
            const dates=datesInRange();
            if(!dates.includes(selectedDay)) selectedDay=dates.find(d=>!selectedDay || d>selectedDay) || dates.at(-1) || null;
            const index=dates.indexOf(selectedDay);
            previousDay=index>0 ? dates[index-1] : null;
            nextDay=index>=0 && index<dates.length-1 ? dates[index+1] : null;
          }
          el('datePages').hidden=!rangeLoaded;
          el('displayedDate').textContent=selectedDay ? new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'long',year:'numeric'}).format(new Date(selectedDay+'T12:00:00')) : 'لا توجد أيام بها سجلات';
          el('previousDayButton').disabled=busy || !rangeLoaded || !previousDay;
          el('nextDayButton').disabled=busy || !rangeLoaded || !nextDay;
          const visibleCount=records.filter(r=>r.Date===selectedDay).length;
          el('rangeSummary').textContent=!rangeLoaded ? '' : browseMode==='range'
            ? `الفترة: ${activeRange.from} إلى ${activeRange.to} — اليوم المعروض: ${visibleCount} سجل. تصدير Excel يشمل الفترة كاملة (${records.length} سجل).`
            : `اليوم المعروض: ${selectedDay} — ${visibleCount} سجل. تصدير Excel يشمل هذا اليوم فقط.`;
          el('emptyRecords').hidden=!rangeLoaded || visibleCount!==0;
          el('emptyRecords').textContent=browseMode==='range' && !records.length ? 'لا توجد سجلات حضور في الفترة المختارة.' : 'لا توجد سجلات حضور في اليوم المعروض.';
          updateFilterHint();
        }
        function renderRecords() {
          renderDatePages();
          const body = document.querySelector('#recordsTable tbody');
          body.replaceChildren();
          sortedRecords().filter(r=>r.Date===selectedDay).forEach(r => {
            const row = body.insertRow();
            [r.Date,r.Day,r.Name,r.CheckIn,r.CheckOut,r.Hours,r.Comments].forEach(v => { row.insertCell().textContent = v ?? ''; });
            const actions = row.insertCell();
            const edit = document.createElement('button');
            edit.textContent='تعديل'; edit.type='button'; edit.disabled=busy;
            edit.setAttribute('aria-label',`تعديل سجل ${r.Name} بتاريخ ${r.Date}`);
            edit.addEventListener('click',()=>startEdit(r.Id));
            const remove = document.createElement('button');
            remove.textContent='حذف'; remove.type='button'; remove.disabled=busy;
            remove.style.backgroundColor='#b42318'; remove.style.marginInlineStart='6px';
            remove.setAttribute('aria-label',`حذف سجل ${r.Name} بتاريخ ${r.Date}`);
            remove.addEventListener('click',()=>deleteRecord(r.Id));
            actions.append(edit,remove);
          });
        }
        function setBusy(value) {
          busy=value;
          ['addButton','cancelEditButton','reloadButton','checkIn','checkOut','comments','fromDate','toDate','filterButton','todayButton'].forEach(id=>el(id).disabled=value);
          el('empSelect').disabled=value || !!editingId;
          el('attDate').disabled=value || !!editingId;
          renderRecords();
        }
        function startEdit(id) {
          if(busy || !currentUser || el('appPanel').hidden) return;
          const rec=records.find(r=>r.Id===id); if(!rec) return;
          if(!editingId) originalForm=Object.fromEntries(['empSelect','attDate','checkIn','checkOut','comments'].map(id=>[id,el(id).value]));
          editingId=id; pendingRecord=null;
          el('empSelect').value=String(rec.EmployeeId); el('attDate').value=rec.Date;
          el('checkIn').value=rec.CheckIn; el('checkOut').value=rec.CheckOut; el('comments').value=rec.Comments;
          el('empSelect').disabled=true; el('attDate').disabled=true;
          el('addButton').textContent='حفظ التعديل';
          el('cancelEditButton').hidden=false; el('editNotice').hidden=false;
          el('editNotice').textContent=`تعديل سجل ${rec.Name} — ${rec.Date}`;
          el('editNotice').scrollIntoView({behavior:'smooth',block:'center'}); el('checkIn').focus();
          status('عدّل وقت الحضور أو الانصراف أو الملاحظات، ثم اضغط حفظ التعديل.');
        }
        function cancelEdit(force=false) {
          if(busy && !force) return;
          editingId=null;
          if(originalForm) Object.entries(originalForm).forEach(([id,value])=>el(id).value=value);
          originalForm=null;
          el('empSelect').disabled=busy; el('attDate').disabled=busy;
          el('addButton').textContent='إضافة تسجيل';
          el('cancelEditButton').hidden=true; el('editNotice').hidden=true;
          if(!force) status('تم إلغاء التعديل دون حفظ.');
        }
        async function deleteRecord(id) {
          if(busy || !currentUser || el('appPanel').hidden) return;
          const rec=records.find(r=>r.Id===id); if(!rec) return;
          if(!confirm(`هل تريد حذف سجل ${rec.Name} بتاريخ ${rec.Date}؟ لا يمكن التراجع عن الحذف.`)) return;
          const version=accessVersion; setBusy(true); status('جارٍ حذف السجل...');
          try {
            const {data,error}=await db.from('attendance_records').delete().eq('id',id).select('id').single();
            if(error) throw error;
            if(version!==accessVersion) return;
            records=records.filter(r=>r.Id!==data.id);
            if(editingId===id) cancelEdit(true);
            if(browseMode==='home') {
              previousDay=null;nextDay=null;
              try {await loadData(version,activeRange,'home',selectedDay);}
              catch {if(version===accessVersion)status('تم حذف السجل، لكن تعذر تحديث التنقل. اضغط تحديث السجلات.');return;}
              if(version!==accessVersion)return;
            }
            status('تم حذف السجل من Supabase.');
          } catch(error) {if(version===accessVersion) status('تعذر تأكيد الحذف. حدّث السجلات قبل إعادة المحاولة: '+error.message);}
          finally {setBusy(false);}
        }
        function mapRecord(r) {
          const employee = employees.find(e => e.id === r.employee_id);
          return {Id:r.id, CreatedAt:r.created_at, EmployeeId:r.employee_id, Date:r.attendance_date,
            Day:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(r.attendance_date+'T12:00:00').getDay()],
            Name:employee?.name ?? String(r.employee_id), CheckIn:r.check_in?.slice(0,5) ?? '', CheckOut:r.check_out?.slice(0,5) ?? '', Hours:r.hours, Comments:r.comments};
        }
        async function loadData(version, range = activeRange, mode = browseMode, day = selectedDay) {
          const {data:people,error:peopleError} = await db.from('employees').select('id,name,lob,display_order').order('display_order');
          if(peopleError) throw peopleError;
          const rows=[];
          for(let start=0;;start+=1000) {
            const {data,error} = await db.from('attendance_records').select('*').gte('attendance_date',range.from).lte('attendance_date',range.to).order('attendance_date').order('created_at').order('id').range(start,start+999);
            if(error) throw error;
            rows.push(...data);
            if(data.length<1000) break;
          }
          let previousDate=null, nextDate=null;
          if(mode==='home') {
            const results=await Promise.all([
              db.from('attendance_records').select('attendance_date').lt('attendance_date',day).order('attendance_date',{ascending:false}).limit(1),
              db.from('attendance_records').select('attendance_date').gt('attendance_date',day).order('attendance_date',{ascending:true}).limit(1)
            ]);
            for(const result of results) if(result.error) throw result.error;
            previousDate=results[0].data[0]?.attendance_date || null;
            nextDate=results[1].data[0]?.attendance_date || null;
          }
          if(version !== accessVersion) return;
          employees=people;
          const select=el('empSelect'); const previous=select.value; select.replaceChildren();
          employees.forEach(e=> { const option=document.createElement('option'); option.value=String(e.id); option.textContent=`${e.name} (${e.id})`; select.append(option); });
          if(employees.some(e=>String(e.id)===previous)) select.value=previous;
          records=rows.map(mapRecord); activeRange={...range}; browseMode=mode;
          selectedDay=day; previousDay=previousDate; nextDay=nextDate;
          if(mode==='home') {el('fromDate').value=range.from;el('toDate').value=range.to;}
          rangeLoaded=true; renderRecords();
        }
        async function showSession(session) {
          const version=++accessVersion;
          cancelEdit(true);
          currentUser=session?.user ?? null;
          pendingRecord=null; records=[]; employees=[]; rangeLoaded=false; selectedDay=todayDate(); previousDay=null; nextDay=null; browseMode='home'; activeRange={from:selectedDay,to:selectedDay}; el('fromDate').value=selectedDay; el('toDate').value=selectedDay; renderRecords();
          el('empSelect').replaceChildren(); el('appPanel').hidden=true;
          el('loginPanel').hidden=!!currentUser; el('sessionPanel').hidden=!currentUser;
          if(!currentUser) {status('سجّل الدخول لعرض سجلات الحضور.'); return;}
          el('accountUsername').textContent='';
          status('جارٍ تحميل البيانات...');
          try {
            const {data,error}=await db.from('app_users').select('user_id,username').eq('user_id',currentUser.id).maybeSingle();
            if(error) throw error;
            if(version !== accessVersion) return;
            if(!data) {status('هذا الحساب لم يتم تفعيل صلاحية الحضور له. تواصل مع مسؤول المشروع.'); return;}
            el('accountUsername').textContent=data.username || 'مستخدم';
            await loadData(version);
            if(version !== accessVersion) return;
            el('appPanel').hidden=false;
            status(`تم تحميل ${records.length} سجل حضور.`);
          } catch(error) {if(version===accessVersion) status('تعذر تحميل البيانات: '+error.message);}
        }
        el('loginForm').addEventListener('submit',async event=>{
          event.preventDefault(); el('loginButton').disabled=true; status('جارٍ تسجيل الدخول...');
          try {
            const response=await fetch(SUPABASE_URL+'/functions/v1/username-login', {
              method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
              body:JSON.stringify({username:el('username').value.trim().toLowerCase(),password:el('password').value})
            });
            const tokens=await response.json();
            if(!response.ok) throw new Error(tokens.error || 'تعذر تسجيل الدخول.');
            const {data,error}=await db.auth.setSession({access_token:tokens.access_token,refresh_token:tokens.refresh_token});
            if(error) throw error;
            activeRange={from:todayDate(),to:todayDate()};
            el('fromDate').value=activeRange.from; el('toDate').value=activeRange.to;
            el('password').value=''; await showSession(data.session);
          } catch(error) {status('تعذر تسجيل الدخول: '+error.message);}
          finally {el('loginButton').disabled=false;}
        });
        el('logoutButton').addEventListener('click',async()=>{
          const {error}=await db.auth.signOut({scope:'local'});
          if(error) {status('تعذر تسجيل الخروج: '+error.message); return;}
          await showSession(null);
        });
        function chosenRange() {
          const range={from:el('fromDate').value,to:el('toDate').value || todayDate()};
          const valid = date => /^\d{4}-\d{2}-\d{2}$/.test(date) && !isNaN(new Date(date+'T12:00:00').getTime()) && new Date(date+'T12:00:00Z').toISOString().slice(0,10)===date;
          if(!valid(range.from) || !valid(range.to)) throw new Error('اختر تاريخ بداية ونهاية صحيحين.');
          if(range.from>range.to) throw new Error('تاريخ البداية يجب أن يكون قبل تاريخ النهاية أو مساويًا له.');
          return range;
        }
        async function applyDateFilter() {
          if(busy || !currentUser || el('appPanel').hidden) return;
          let range;
          try {range=chosenRange();} catch(error){status(error.message);return;}
          if(editingId && !confirm('يوجد تعديل لم يُحفظ. هل تريد إلغاءه وتغيير الفترة؟')) return;
          cancelEdit(true);
          const version=accessVersion; setBusy(true); status('جارٍ تحميل الفترة المختارة...');
          try {
            await loadData(version,range,'range',null);
            if(version!==accessVersion) return;
            renderRecords(); status(`تم تحميل ${records.length} سجل حضور. يتم عرض يوم واحد في كل مرة.`);
          } catch(error) {if(version===accessVersion)status('تعذر تحميل الفترة. النتائج السابقة لم تتغير: '+error.message);}
          finally {setBusy(false);}
        }
        el('filterForm').addEventListener('submit',event=>{event.preventDefault();void applyDateFilter();});
        ['fromDate','toDate'].forEach(id=>el(id).addEventListener('input',updateFilterHint));
        async function openHomeDay(day) {
          if(busy || !currentUser || el('appPanel').hidden) return;
          if(editingId && !confirm('يوجد تعديل لم يُحفظ. هل تريد إلغاءه والانتقال ليوم آخر؟')) return;
          cancelEdit(true);
          const version=accessVersion;setBusy(true);status('جارٍ تحميل اليوم...');
          try {
            await loadData(version,{from:day,to:day},'home',day);
            if(version===accessVersion) status(`تم تحميل سجلات يوم ${day}.`);
          } catch(error) {if(version===accessVersion) status('تعذر تحميل اليوم. النتائج السابقة لم تتغير: '+error.message);}
          finally {setBusy(false);}
        }
        async function navigateDay(direction) {
          if(busy || !rangeLoaded || !currentUser || el('appPanel').hidden || filterDirty()) return;
          const day=direction<0 ? previousDay : nextDay;
          if(!day)return;
          if(browseMode==='home') return openHomeDay(day);
          if(editingId && !confirm('يوجد تعديل لم يُحفظ. هل تريد إلغاءه والانتقال ليوم آخر؟')) return;
          cancelEdit(true);selectedDay=day;renderRecords();
        }
        el('previousDayButton').addEventListener('click',()=>void navigateDay(-1));
        el('nextDayButton').addEventListener('click',()=>void navigateDay(1));
        el('todayButton').addEventListener('click',()=>void openHomeDay(todayDate()));
        el('reloadButton').addEventListener('click',()=>{
          if(browseMode==='home') void openHomeDay(selectedDay);
          else void refreshRange();
        });
        async function refreshRange() {
          if(busy || !currentUser || el('appPanel').hidden)return;
          if(editingId && !confirm('يوجد تعديل لم يُحفظ. هل تريد إلغاءه وتحديث السجلات؟')) return;
          cancelEdit(true);
          const version=accessVersion;setBusy(true);
          try {await loadData(version,activeRange,'range',selectedDay);}
          catch(error){if(version===accessVersion)status('تعذر تحديث السجلات: '+error.message);}
          finally {setBusy(false);}
        }
        db.auth.onAuthStateChange((event,session)=>{
          if(event==='SIGNED_OUT') void showSession(null);
        });
        db.auth.getSession().then(({data,error})=>error?status(error.message):showSession(data.session));

        async function addRecord() {
            if(busy || !currentUser || el('appPanel').hidden) return;
            const employee = employees.find(e => String(e.id) === el('empSelect').value);
            if(!employee) {status('اختر الموظف أولاً.');return;}
            const empName = employee.name;
            const dateVal = document.getElementById('attDate').value;
            const inVal = document.getElementById('checkIn').value;
            const outVal = document.getElementById('checkOut').value;
            const commentVal = document.getElementById('comments').value;

            if(!dateVal) { alert('يرجى تحديد التاريخ'); return; }

            const d = new Date(dateVal);
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[d.getDay()];

            let hrs = "08:00";
            if(commentVal.includes('Leave')) {
                hrs = "00:00";
            } else if(inVal && outVal) {
                const t1 = new Date(`2000-01-01T${inVal}:00`);
                const t2 = new Date(`2000-01-01T${outVal}:00`);
                let diff = (t2 - t1) / (1000 * 60);
                if(diff < 0) diff += 24 * 60;
                const h = Math.floor(diff / 60);
                const m = diff % 60;
                hrs = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
            }

            const payload={employee_id:employee.id,attendance_date:dateVal,check_in:inVal||null,check_out:outVal||null,hours:hrs,comments:commentVal,created_by:currentUser.id};
            const editId=editingId;
            const signature=JSON.stringify(payload);
            if(!editId && (!pendingRecord || pendingRecord.signature!==signature)) pendingRecord={signature,id:crypto.randomUUID()};
            const id=editId ?? pendingRecord.id;
            const version=accessVersion;
            setBusy(true);
            status(editId ? 'جارٍ حفظ التعديل...' : 'جارٍ حفظ التسجيل...');
            try {
              let result;
              if(editId) {
                result=await db.from('attendance_records').update({check_in:payload.check_in,check_out:payload.check_out,hours:payload.hours,comments:payload.comments}).eq('id',editId).select().single();
              } else {
                result=await db.from('attendance_records').insert({id,...payload}).select().single();
                if(result.error?.code==='23505') result=await db.from('attendance_records').select('*').eq('id',id).single();
              }
              const {data,error}=result;
              if(error) throw error;
              if(version!==accessVersion) return;
              if(editId) records=records.map(r=>r.Id===editId ? mapRecord(data) : r);
              else if(data.attendance_date>=activeRange.from && data.attendance_date<=activeRange.to && !records.some(r=>r.Id===data.id)) records.push(mapRecord(data));
              pendingRecord=null;
              if(editId) cancelEdit(true);
              if(!editId && browseMode==='home') {
                previousDay=null;nextDay=null;
                try {await loadData(version,activeRange,'home',selectedDay);}
                catch {if(version===accessVersion)status('تم حفظ التسجيل، لكن تعذر تحديث التنقل. اضغط تحديث السجلات.');return;}
                if(version!==accessVersion)return;
              }
              status(editId ? 'تم حفظ التعديل في Supabase.' : (data.attendance_date<activeRange.from || data.attendance_date>activeRange.to ? 'تم حفظ التسجيل. تاريخه خارج الفترة المعروضة؛ غيّر الفلتر لعرضه.' : 'تم حفظ التسجيل في Supabase.'));
            } catch(error) {if(version===accessVersion) status('تعذر تأكيد الحفظ. يمكنك إعادة المحاولة أو تحديث السجلات: '+error.message);}
            finally {setBusy(false);}

        }

        function exportToExcel() {
            if(busy || !rangeLoaded || !currentUser || el('appPanel').hidden) return;
            if(filterDirty()) {status('اضغط عرض الفترة أولاً لتطبيق التواريخ الجديدة.');return;}
            const exportRecords=sortedRecords().filter(r=>browseMode==='range' || r.Date===selectedDay); // A filtered period exports in full; home exports the displayed day.
            if(exportRecords.length === 0) {
                alert('لا توجد سجلات في الفترة المختارة لتصديرها.');
                return;
            }

            const wb = XLSX.utils.book_new();

            // 1. Attendance Sheet
            const wsData = [["Date", "Day", "Name", "Check In", "Check Out", "Total Working Hours", "Comments"]];
            exportRecords.forEach(r => {
                wsData.push([r.Date, r.Day, r.Name, r.CheckIn, r.CheckOut, r.Hours, r.Comments]);
            });
            const ws1 = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws1, "Support Team Attendance");

            // 2. Summary Sheet
            const emps = employees;

            const summaryHeaders = [
                "ID", "Name", "LOB", "Month Days", "Signed In", 
                "Attende at Another Project", "Vacations \n(Annual/Causal)", 
                "Sick Leave", "Public Holidays", "Absence/ Not Signed In", 
                "Actual Working Hours", "Working Days in Weekends (Remotely)", 
                "Working Days in Weekends (On Site)", "Total Over Time "
            ];
            const summaryRows = [summaryHeaders];

            emps.forEach(e => {
                const empRecs = exportRecords.filter(r => r.EmployeeId === e.id);
                const signedIn = empRecs.filter(r => !r.Comments.includes('Leave')).length;
                const vac = empRecs.filter(r => r.Comments.includes('Annual') || r.Comments.includes('Casual')).length;
                const sick = empRecs.filter(r => r.Comments.includes('Sick')).length;

                summaryRows.push([
                    e.id, e.name, e.lob, 21, signedIn, null, vac > 0 ? vac : null, sick > 0 ? sick : null, null, null, "140:00", null, null, null
                ]);
            });

            const ws2 = XLSX.utils.aoa_to_sheet(summaryRows);
            XLSX.utils.book_append_sheet(wb, ws2, "Summary");

            XLSX.writeFile(wb, `Attendance_Report_${activeRange.from}_to_${activeRange.to}.xlsx`);
        }
    </script>
